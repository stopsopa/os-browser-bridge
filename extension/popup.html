<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OS Browser Bridge Settings</title>
  <!-- form controls, buttons and links are styled by gcp-css (see comment at the top of gcp-css.css) -->
  <link rel="stylesheet" href="gcp-css.css">
  <style>
    /* only things which gcp-css doesn't cover: page box, title, status dot and status line */
    body {
      width: 350px;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
      background: #ffffff;
      color: #3c4043;
    }

    h1 {
      font-size: 18px;
      font-weight: 500;
      margin: 0 0 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* color of the dot is also the color of its pulse (currentColor) */
    .status-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      color: #bdc1c6;
      background-color: currentColor;
      animation: pulse 2s infinite;

      &.connected {
        color: #1e8e3e;
      }

      &.connecting {
        color: #f9ab00;
      }

      &.disconnected {
        color: #d93025;
      }
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 70%, transparent);
      }
      70% {
        box-shadow: 0 0 0 10px transparent;
      }
      100% {
        box-shadow: 0 0 0 0 transparent;
      }
    }

    .status-text {
      font-size: 12px;
      margin: 16px 0;
      padding: 8px;
      background: #f1f3f4;
      border-radius: 4px;
      text-align: center;
      word-break: break-all;

      &.connected {
        background: #e6f4ea;
        color: #137333;
      }

      &.connecting {
        background: #fef7e0;
        color: #b06000;
      }

      &.disconnected {
        background: #fce8e6;
        color: #c5221f;
      }
    }

    .footer {
      margin: 0;
      text-align: center;
    }
  </style>
</head>
<body>
  <form class="gcp-css" id="settingsForm" novalidate data-testid="form-settings">
    <h1>
      <span class="status-indicator" id="statusIndicator" data-testid="status-indicator"></span>
      OS Browser Bridge
    </h1>

    <div class="input-wrapper" id="serverUrlWrapper">
      <input
        type="text"
        id="serverUrl"
        name="serverUrl"
        placeholder=" "
        autocomplete="off"
        spellcheck="false"
        aria-describedby="serverUrl-helper"
        data-testid="input-server-url"
      />
      <label for="serverUrl">Server URL</label>
      <div class="error" id="serverUrl-error" data-testid="error-server-url">Please enter a valid server URL</div>
      <div class="helper-text" id="serverUrl-helper">e.g. localhost:8080 or ws://localhost:8080 (ws:// is added when omitted). Empty value removes the URL.</div>
    </div>

    <div class="checkbox-wrapper">
      <input type="checkbox" id="connectionToggle" name="connectionToggle" data-testid="checkbox-connection">
      <label for="connectionToggle">Connect to the server</label>
      <div class="helper-text">Saved immediately when changed.</div>
    </div>

    <button type="submit" id="saveButton" data-testid="btn-save">Save Settings</button>

    <div class="status-text" id="statusText" role="status" data-testid="status-text">
      Initializing...
    </div>

    <p class="footer">
      <a href="https://github.com/stopsopa/os-browser-bridge" target="_blank" data-testid="link-homepage">Project Homepage</a>
    </p>
  </form>

  <script src="popup.js"></script>
</body>
</html>
